plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mysite'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// 의존성 설정
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// repository를 테스트하기 위한 라이브러리
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// layout 템플릿 사용
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'		
	
	// devtools 설정: 프로젝트의 변경사항을 저장하면 자동으로 tomcat 서버가 동작하도록 하는 기능
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// lombok 설정: 자바 클래스의 멤버변수에 대한 생성자, getter/setter, toString() 등의 메소드를 자동으로 생성
	// - 롬복은 컴파일할 때만, 어노테이션을 분석하여 실행하도록 함
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// MySQL DB 설정
	implementation 'com.mysql:mysql-connector-j'
	
	// Oracle DB 설정
	//implementation 'com.oracle.database.jdbc:ojdbc6:11.2.0.4'
	
	// JPA 설정
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
	// QueryDSL 설정
	//implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	//annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	//annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	//annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	
	// Spring Boot Validateion 설정 - 폼 유효성 검증
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// 스프링 시큐리티 설정
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	
	// 마크다운 설정
	implementation 'org.commonmark:commonmark:0.30.0'
}

// QueryDSL 설정 - Q파일 생성 위치 설정
