<html layout:decorate="~{layout/layout}">
	<div layout:fragment="content" class="container mt-5 px-3 d-flex justify-content-center align-items-center">
		<form th:action="@{/user/login}" method="post" class="w-100" style="max-width: 400px;">
			<div class="text-center mb-4">
				<h4 class="fw-bold">오늘도 춤 이야기, 함께해요</h4>
				<p class="mt-2 text-muted small">궁금한 것부터 일상의 순간까지 자유롭게 나눠보세요.</p>
			</div>
			<div th:if="${param.error}">
				<div class="alert alert-danger">
					 아이디 또는 비밀번호를 확인해 주세요.
				</div>
			</div>
			<div class="mb-3">
				<input type="text" name="username" id="username" class="form-control" style="height: 40px;" placeholder="아이디 입력">
			</div>
			<div class="mb-3">
				<input type="password" name="password" id="password" class="form-control" style="height: 40px;" placeholder="비밀번호 입력">
			</div>
			<button type="submit" class="btn btn-common w-100" style="height: 40px;">로그인</button>
			<p class="text-center mt-4 text-muted">아직 회원이 아니신가요? <a th:href="@{/user/signup}" class="text-dark fw-bold">회원가입</a></p>
		</form>
	</div>
</html>
