<html layout:decorate="~{layout/layout}">
	<div layout:fragment="content" class="container my-3  mt-5 px-3 d-flex justify-content-center">
		<div class="w-100 mb-5" style="max-width: 400px;">
			<div class="text-center mb-4">
					<h4>회원 정보 수정</h4>
			</div>
			<form th:action="@{/user/update}" th:object="${userUpdateForm}" method="post">
				<div th:replace="~{form_errors :: formErrorsFragment}"></div>
				<div class="mb-3">
					<label for="username" class="form-label">아이디</label>
					<input type="text" th:field="*{username}" id="username" class="form-control" style="pointer-events: none;" readonly>
				</div>
				<div class="mb-3">
					<label for="password1" class="form-label">비밀번호</label>
					<input type="password" th:field="*{password1}" id="password1" class="form-control" autofocus>
				</div>
				<div class="mb-3">
					<label for="possword2" class="form-label">비밀번호 확인</label>
					<input type="password" th:field="*{password2}" id="password2" class="form-control">
				</div>
				<div class="mb-3">
					<label for="email" class="form-label">이메일</label>
					<input type="email" th:field="*{email}" id="email" class="form-control">
				</div>
				<div class="mb-3">
					<label for="nickname" class="form-label">닉네임</label>
					<input type="text" th:field="*{nickname}" id="nickname" class="form-control">
				</div>
				<button type="submit" class="btn btn-primary w-100">수정 완료</button>
			</form>
		</div>
	</div>
</html>
