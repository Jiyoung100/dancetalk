<html layout:decorate="~{layout/layout}">
	<div layout:fragment="content" class="container mt-4 d-flex justify-content-center">
		<div class="w-100 my-3" style="max-width: 1200px;">
			<h2 class="fw-bold" th:text="${category.title}"></h2>
			<p class="text-muted" th:text="${category.description}"></p>
			<!-- 질문 목록 -->
			<table class="table">
				<thead>
					<th class="text-center" style="width: 7%;">번호</th>
					<th class="text-left">제목</th>
					<th class="text-center" style="width: 10%;">작성자</th>
					<th class="text-center" style="width: 7%;">조회수</th>
					<th class="text-center" style="width: 10%;">작성일</th>
				</thead>
				<tbody>
					<tr th:each="question, loop : ${paging}" class="question-row">
						<td class="question-text text-muted" th:text="${paging.getTotalElements -(paging.number*paging.size) - loop.index}"></td>
						<td class="text-start">
							<a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}" class="question-title"></a>
							<span class="small ms-2 text-viewcount"
								th:if="${#lists.size(question.answerList) > 0}" 
								th:text="${#lists.size(question.answerList)}">
							</span>
						</td>
						<td th:if="${question.author != null}" th:text="${question.author.nickname}" class="question-text text-nowrap"></td>
						<td th:text="${question.viewCount}" class="question-text"></td>
						<td th:text="${#temporals.format(question.createDate, 'MM.dd')}" class="question-text"></td>
					</tr>
				</tbody>	
			</table>
			
			<!-- 질문 등록 버튼, 검색창 -->
			<div class="d-flex my-3 justify-content-between">
				<div class="">
					<a class="btn btn-common" th:href="@{/question/create}">글쓰기</a>
				</div>
				<div class="input-group border border-secondary w-25">
					<input type="text" id="search_kw" class="form-control border-0 shadow-none" th:value="${kw}" placeholder="게시물 검색">
					<button type="button" id="btn_search" class="btn border-0 shadow-none">
						<i class="bi bi-search"></i>
					</button>
				</div>
			</div>
					
			<!-- 검색 폼 -->
			<form th:action="@{|/question/list/${category.id}|}" method="get" id="searchForm">
				<input type="hidden" id="kw" name="kw" th:value="${kw}">
				<input type="hidden" id="page" name="page" th:value="${paging.number}">
			</form>		
			
			<!-- 페이징 -->
			<div th:if="${!paging.isEmpty()}">
				<ul class="pagination pagination-sm justify-content-center">
					<!-- 첫 페이지 -->
					<li th:classappend="${!paging.hasPrevious} ? 'disabled'" class="page-item">
						<a href="javascript:void(0);" th:data-page="${0}" class="page-link">
							<i class="bi bi-chevron-double-left"></i>
						</a>
					</li>
					<!-- 이전 -->
					<li th:classappend="${!paging.hasPrevious} ? 'disabled'" class="page-item">
						<a href="javascript:void(0);" th:data-page="${paging.number-1}" class="page-link">
							<i class="bi bi-chevron-left"></i>
						</a>
					</li>
					<!-- 페이지 번호 -->
					<li th:each="page : ${#numbers.sequence(0, paging.totalPages-1)}"
						th:classappend="${page == paging.number} ? 'active'"
						th:if="${page >= paging.number-5 and page <= paging.number+5}"
						class="page-item">
						<a th:text="${page+1}" href="javascript:void(0);" th:data-page="${page}" class="page-link"></a>
					</li>
					<!-- 다음 -->
					<li th:classappend="${!paging.hasNext} ? 'disabled'" class="page-item">
						<a href="javascript:void(0);" th:data-page="${paging.number+1}" class="page-link">
							<i class="bi bi-chevron-right"></i>
						</a>
					</li>
					<!-- 끝 -->
					<li th:classappend="${!paging.hasNext} ? 'disabled'" class="page-item">
						<a href="javascript:void(0);" th:data-page="${paging.totalPages-1}" class="page-link">
							<i class="bi bi-chevron-double-right"></i>
						</a>
					</li>
				</ul>
			</div>
		</div>
	</div>
	<!-- Javascript -->
	<script layout:fragment="script">
		// 검색 버튼 이벤트
		const btn_search = document.getElementById("btn_search");
		btn_search.addEventListener("click", function() {
			const search_kw = document.getElementById("search_kw");
			document.getElementById("kw").value = search_kw.value;
			document.getElementById("page").value = 0;
			document.getElementById("searchForm").submit();
		})	
		
		// 검색상자 엔터키 이벤트
		const search_kw = document.getElementById("search_kw");
		search_kw.addEventListener("keydown", function(e) {
			if(e.key === 'Enter') {
				const search_kw = document.getElementById("search_kw");
				document.getElementById("kw").value = search_kw.value;
				document.getElementById("page").value = 0;
				document.getElementById("searchForm").submit();
			}
		})
	
		// 페이지 이동 이벤트 (검색을 포함)
		const page_elements = document.getElementsByClassName("page-link");
		Array.from(page_elements).forEach(function(element) {
			element.addEventListener("click", function() {
				document.getElementById("page").value = this.dataset.page;
				document.getElementById("searchForm").submit();
			})
		})		
	</script>
	
</html>
