<html layout:decorate="~{layout/layout}">
	<div layout:fragment="content" class="container mt-5 px-3 d-flex justify-content-center align-items-center">
		<form th:action="@{/user/login}" method="post" class="w-100" style="max-width: 400px;">
			<div class="text-center fw-bold mb-4">
				<h4>로그인</h4>
			</div>
			<div th:if="${param.error}">
				<div class="alert alert-danger">
					 아이디 또는 비밀번호를 확인해 주세요.
				</div>
			</div>
			<div class="mb-3">
				<label for="username" class="form-label">아이디</label>
				<input type="text" name="username" id="username" class="form-control" style="height: 40px;">
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">비밀번호</label>
				<input type="password" name="password" id="password" class="form-control" style="height: 40px;">
			</div>
			<button type="submit" class="btn btn-primary w-100" style="height: 40px;">로그인</button>
		</form>
	</div>
</html>
