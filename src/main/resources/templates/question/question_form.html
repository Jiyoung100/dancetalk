<html layout:decorate="~{layout/layout}">
	<div layout:fragment="content" class="container mt-3 d-flex justify-content-center">
		<div class="w-100" style="max-width: 1000px;">
			<h4 th:if="${questionForm.subject == null}" class="border-bottom my-3 pb-3 fw-bold">게시글 작성</h4>
			<h4 th:if="${questionForm.subject != null}" class="border-bottom my-3 pb-3 fw-bold">게시글 수정</h4>
			<form th:object="${questionForm}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<!-- 유효성 검증 에러 -->
				<div th:replace="~{form_errors :: formErrorsFragment}"></div>
				<div class="mb-3">
					<label class="form-label" for="category" >카테고리</label>
					<select th:field="*{categoryId}" class="form-select">
						<option th:each="category : ${categoryList}" th:value="${category.id}" th:text="${category.title}"></option>
					</select>
				</div>
				<div class="mb-3">
					<label class="form-label" for="subject">제목</label>
					<input class="form-control" th:field="*{subject}" type="text" id="subject">
				</div>
				<div class="mb-3">
					<label class="form-label" for="content">내용</label>
					<textarea class="form-control" th:field="*{content}" id="content" rows="10"></textarea>
				</div>
				<input th:if="${questionForm.subject == null}" class="btn btn-primary my-2" type="submit" value="등록">
				<input th:if="${questionForm.subject != null}" class="btn btn-success my-2" type="submit" value="수정">
			</form>
		</div>
	</div>
</html>
