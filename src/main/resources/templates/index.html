<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<th:block th:replace="~{layout/link}"></th:block>
	<link rel="icon" type="image/x-icon" th:href="@{/icons/favicon.ico}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">
	<title>댄스 커뮤니티 | DanceTalk</title>
</head>
<body>	
	<!-- 메뉴 네비게이션 -->
	<nav th:replace="~{layout/navbar :: navbarFragment}"></nav>
	
	<!-- Swiper -->
	<div class="swiper">
	    <div class="swiper-wrapper">
	        <div class="swiper-slide slide1">
				<div class="container h-100 d-flex align-items-center justify-content-center">
                    <div class="main-title">
						<p>DANCE · SHARE · CONNECT</p>
                        <h1><span style="color: #8B5CF6">춤</span>으로 나누고, 함께 이어지는 순간</h1>
						<a th:href="@{/question/list/1}" class="btn btn-outline-light rounded-pill">
							<span>커뮤니티 둘러보기</span>
						</a>
                    </div>
                </div>
	        </div>
	        <div class="swiper-slide slide2">
				<div class="container h-100 d-flex align-items-center justify-content-center">
					<div class="main-title">
						<p>FIND YOUR CREW</p>
                        <h1>같이 <span style="color: #8B5CF6">춤</span>출 사람을 찾고 있나요?</h1>
						<a th:href="@{/question/list/2}" class="btn btn-outline-light rounded-pill">
							<span>팀원 찾기</span>
						</a>
                    </div>
                </div>
	        </div>
	    </div>
	</div>

	<script>
	    const swiper = new Swiper(".swiper", {
	        effect: "fade",

	        fadeEffect: {
	            crossFade: true
	        },
	        speed: 1500,
	        loop: true,

	        autoplay: {
	            delay: 5000,
	            disableOnInteraction: false,
	        },
	    });
	</script>
</body>
</html>
