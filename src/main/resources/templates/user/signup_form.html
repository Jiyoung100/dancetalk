<html layout:decorate="~{layout/layout}">
	<div layout:fragment="content" class="container mt-5 px-3 d-flex justify-content-center">
		<div class="w-100 mb-5" style="max-width: 400px;">
			<div class="text-center fw-bold mb-4">
				<h4>회원 가입</h4>
			</div>
			<form th:action="@{/user/signup}" th:object="${userCreateForm}" method="post">
				<div th:replace="~{form_errors :: formErrorsFragment}"></div>
				<div class="mb-3">
					<label for="username" class="form-label">아이디</label>
					<input type="text" th:field="*{username}" id="username" class="form-control" style="height: 40px;">
				</div>
				<div class="mb-3">
					<label for="password1" class="form-label">비밀번호</label>
					<input type="password" th:field="*{password1}" id="password1" class="form-control" style="height: 40px;">
				</div>
				<div class="mb-3">
					<label for="possword2" class="form-label">비밀번호 확인</label>
					<input type="password" th:field="*{password2}" id="password2" class="form-control" style="height: 40px;">
				</div>
				<div class="mb-3">
					<label for="email" class="form-label">이메일</label>
					<input type="email" th:field="*{email}" id="email" class="form-control" style="height: 40px;">
				</div>
				<div class="mb-3">
					<label for="nickname" class="form-label">닉네임</label>
					<input type="text" th:field="*{nickname}" id="nickname" class="form-control" style="height: 40px;">
				</div>
				<button type="submit" class="btn btn-common w-100">회원가입</button>
			</form>
		</div>
	</div>
</html>
